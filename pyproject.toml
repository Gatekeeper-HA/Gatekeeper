[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper"
dynamic = ["version"]
description = "Local AI doorbell assistant: greets visitors, listens, classifies intent and replies."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Heavy runtime pieces are optional so the core logic can be tested without torch/aiortc.
speech = [
    "faster-whisper",
    "kokoro",
    "numpy",
    "soundfile",
]
talkback = [
    "aiohttp",
    "aiortc",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
gatekeeper = "gatekeeper.app:main"

[project.urls]
Source = "https://github.com/Gatekeeper-HA/Gatekeeper"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "VERSION", "README.md", "LICENSE", "requirements.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source_pkgs = ["gatekeeper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
