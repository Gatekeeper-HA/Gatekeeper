[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper"
dynamic = ["version"]
description = "Local AI doorbell assistant: greets visitors, listens, classifies intent and replies."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.0",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Heavy runtime pieces are optional so the core logic can be tested without torch/aiortc.
speech = [
    "faster-whisper",
    "kokoro",
    "numpy",
    "soundfile",
    # Kokoro's, listed so its CPU-only build comes from PyTorch's index ([tool.uv.sources]).
    "torch",
    # faster-whisper (1.2.1) opens audio with av.open(metadata_errors=...), which PyAV 19
    # removed: Whisper can't load. Lift this once a faster-whisper release handles PyAV 19.
    "av<19",
    # Kokoro's English pronunciation (misaki) needs spaCy's small English model. It isn't
    # on PyPI, and misaki downloads it at every container start when it's missing.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
talkback = [
    "aiohttp",
    "aiortc",
]
doorbell = [
    "reolink-aio",
]
# The web page away from home through Gatekeeper's relay, with Cloud Plus (tunnel.py): SniTun,
# the relay behind Home Assistant Cloud.
remote = [
    "snitun",
]
dev = [
    "numpy",  # the audio tap and VAD work on numpy arrays; cheap, unlike torch
    "av",  # PyAV: the recording tests write and read real clips
    "cryptography",  # the web page's self-signed certificate (WEB_TLS)
    "pytest>=8",
    "pyyaml",  # tests compare the Frigate configs
    "pytest-cov>=5",
    "ruff>=0.6",
    "snitun",  # the tunnel's tests run SniTun's own relay and client (tests/test_tunnel.py)
]

[project.scripts]
gatekeeper = "gatekeeper.app:main"

[project.urls]
Source = "https://github.com/Gatekeeper-HA/Gatekeeper"

# torch's CPU-only build, for Linux: PyPI's pulls ~17 NVIDIA CUDA packages (several GB) that
# are useless without an NVIDIA GPU. Only torch comes from this index. Its copies of other
# packages have no publish times, so scripts/lock.sh's cooldown couldn't apply to them.
[tool.uv]
# The image is Linux (x86_64 and aarch64): scripts/lock.sh resolves for Linux only.
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.metadata]
# For en-core-web-sm's URL above; the package is installed from GitHub, not PyPI.
allow-direct-references = true

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "VERSION", "README.md", "LICENSE", "requirements.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "cloud"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "cloud/tests"]
pythonpath = ["cloud"]  # the name service (cloud/README.md)
addopts = "-q"

[tool.coverage.run]
source_pkgs = ["gatekeeper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
