# coturn, for Gatekeeper's Live away from home (cloud/README.md, "The relay"). compose.yml
# adds the secret, the realm and this server's addresses.

listening-port=3478
# The media ports; the firewall opens the same range.
min-port=49152
max-port=49999

# Credentials only from the name service (POST /v1/hubs/<id>/turn), made with the secret.
use-auth-secret
fingerprint

# Plain TURN over UDP and TCP; no TLS listener yet (no certificate here).
no-tls

# Relayed only to the internet: never to private, special or this server's own addresses
# (compose.yml adds those), so TURN can't be a way into a network, nor into DigitalOcean's
# metadata service (169.254.169.254). coturn checks an IPv4 address written as IPv6
# (::ffff:10.0.0.1) against the IPv4 ranges, so there's no IPv6 range for those: one would
# cover every IPv4 address.
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# :: itself is refused by coturn. A range starting at :: would refuse every IPv4 address
# too (coturn 4.18, checked live), so ::1 is listed on its own.
denied-peer-ip=::1-::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits: a Live view needs one allocation each way, and HD is about 0.5 MB/s.
user-quota=4
total-quota=200
max-bps=1500000

# Nothing else: no admin interface, no version in answers.
no-cli
no-software-attribute

# No session logs: they'd hold phones' and homes' addresses. (simple-log: the file's name
# as written, without a date added.)
no-stdout-log
simple-log
log-file=/dev/null
