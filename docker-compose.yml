# Copy .env.example to .env, fill it in, then: docker compose up -d --build
#
# Configs come from this repo; state (recordings, MQTT data, visitor audio,
# logs, model caches) lives under ${DATA_DIR}, default ./data.

services:
  # Writes the MQTT password file from the passwords in .env, then exits.
  mqtt-auth:
    image: eclipse-mosquitto:2.0.22
    restart: "no"
    environment:
      MQTT_FRIGATE_PASSWORD: "${MQTT_FRIGATE_PASSWORD:?set MQTT_FRIGATE_PASSWORD in .env}"
      MQTT_GATEKEEPER_PASSWORD: "${MQTT_GATEKEEPER_PASSWORD:?set MQTT_GATEKEEPER_PASSWORD in .env}"
      MQTT_HOMEASSISTANT_PASSWORD: "${MQTT_HOMEASSISTANT_PASSWORD:?set MQTT_HOMEASSISTANT_PASSWORD in .env}"
    volumes:
      - ${DATA_DIR:-./data}/mosquitto/auth:/auth
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        f=/auth/passwd.new
        rm -f "$$f"
        touch "$$f"
        chmod 600 "$$f"
        mosquitto_passwd -b "$$f" frigate "$$MQTT_FRIGATE_PASSWORD"
        mosquitto_passwd -b "$$f" gatekeeper "$$MQTT_GATEKEEPER_PASSWORD"
        mosquitto_passwd -b "$$f" homeassistant "$$MQTT_HOMEASSISTANT_PASSWORD"
        chown 1883:1883 "$$f"
        mv "$$f" /auth/passwd

  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: mqtt
    restart: unless-stopped
    networks: [surveil]
    depends_on:
      mqtt-auth:
        condition: service_completed_successfully
    ports:
      - "${SERVER_IP:?set SERVER_IP in .env}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ${DATA_DIR:-./data}/mosquitto/auth:/mosquitto/auth:ro
      - ${DATA_DIR:-./data}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR:-./data}/mosquitto/log:/mosquitto/log

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.4
    container_name: frigate
    restart: unless-stopped
    networks: [surveil]
    depends_on:
      - mqtt
      - go2rtc
    shm_size: "256mb"
    ports:
      # Frigate UI and API, with login (HTTPS). Port 5000 (the same without any
      # authentication) is deliberately not published: Gatekeeper and Home
      # Assistant reach it inside Docker as http://frigate:5000.
      - "${SERVER_IP:?set SERVER_IP in .env}:8971:8971"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Frigate keeps its database, model cache and secrets in /config, so the
      # directory is state; only config.yml comes from the repo.
      - ${DATA_DIR:-./data}/frigate/config:/config
      - ./frigate/config/config.yml:/config/config.yml
      - ${DATA_DIR:-./data}/frigate/storage:/media/frigate
    environment:
      TZ: "${TZ:-America/Chicago}"
      FRIGATE_MQTT_USER: "frigate"
      FRIGATE_MQTT_PASSWORD: "${MQTT_FRIGATE_PASSWORD:?set MQTT_FRIGATE_PASSWORD in .env}"

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: go2rtc
    restart: unless-stopped
    networks: [surveil]
    # go2rtc's API/UI and RTSP restream have no authentication: not published;
    # Frigate and Gatekeeper use them inside Docker. Only its WebRTC media port is,
    # for Gatekeeper's Live page: a browser gets a session only through Gatekeeper's
    # page (behind its password), which asks go2rtc's API for it.
    ports:
      - "${SERVER_IP:?set SERVER_IP in .env}:8555:8555/tcp"
      - "${SERVER_IP:?set SERVER_IP in .env}:8555:8555/udp"
    environment:
      # The address the Live page's browser reaches go2rtc's WebRTC port at.
      SERVER_IP: "${SERVER_IP:?set SERVER_IP in .env}"
      # Substituted into go2rtc.yaml.
      CAMERA_IP: "${CAMERA_IP:?set CAMERA_IP in .env}"
      CAMERA_USER: "${CAMERA_USER:?set CAMERA_USER in .env}"
      CAMERA_PASS: "${CAMERA_PASS:?set CAMERA_PASS in .env}"
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  # Doorbell notifications for the ntfy phone app. Only the "phone" user may
  # read the topic and only Gatekeeper's token may publish to it. The quick reply
  # buttons post to doorbell-replies without logging in; Gatekeeper reads it and
  # checks each button's signature.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    networks: [surveil]
    command: serve
    ports:
      - "${SERVER_IP:?set SERVER_IP in .env}:8090:80"
    environment:
      TZ: "${TZ:-America/Chicago}"
      NTFY_BASE_URL: "http://${SERVER_IP:?set SERVER_IP in .env}:8090"
      NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/lib/ntfy/attachments"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_AUTH_USERS: "gatekeeper:${NTFY_GATEKEEPER_PASSWORD_HASH:?run scripts/ntfy-auth.sh}:user,phone:${NTFY_PHONE_PASSWORD_HASH:?run scripts/ntfy-auth.sh}:user"
      NTFY_AUTH_ACCESS: "gatekeeper:doorbell:write-only,phone:doorbell:read-only,gatekeeper:doorbell-replies:read-only,*:doorbell-replies:write-only"
      NTFY_AUTH_TOKENS: "gatekeeper:${NTFY_GATEKEEPER_TOKEN:?run scripts/ntfy-auth.sh}:Gatekeeper"
    volumes:
      - ${DATA_DIR:-./data}/ntfy:/var/lib/ntfy

  # Optional Home Assistant for testing MQTT discovery and HA notifications.
  # Enable with COMPOSE_PROFILES=ha in .env; then connect HA's MQTT integration
  # to broker "mqtt" as user "homeassistant" (MQTT_HOMEASSISTANT_PASSWORD).
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    profiles: [ha]
    container_name: homeassistant
    restart: unless-stopped
    networks: [surveil]
    depends_on:
      - mqtt
    ports:
      - "${SERVER_IP:?set SERVER_IP in .env}:8123:8123"
    environment:
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR:-./data}/homeassistant:/config

  gatekeeper:
    build: .
    image: gatekeeper:local
    container_name: gatekeeper
    restart: unless-stopped
    networks: [surveil]
    depends_on:
      - mqtt
      - frigate
      - go2rtc
      - ntfy
    shm_size: "1gb"
    ports:
      # The web page: visits and household faces (behind GATEKEEPER_WEB_PASSWORD; nothing
      # listens without it).
      - "${SERVER_IP:?set SERVER_IP in .env}:8098:8098"
    environment:
      TZ: "${TZ:-America/Chicago}"
      MQTT_HOST: "mqtt"
      MQTT_PORT: "1883"
      MQTT_USERNAME: "gatekeeper"
      MQTT_PASSWORD: "${MQTT_GATEKEEPER_PASSWORD:?set MQTT_GATEKEEPER_PASSWORD in .env}"
      MQTT_TOPIC: "frigate/events"
      CAMERA_NAME: "front_door"
      AUDIO_RTSP_URL: "rtsp://go2rtc:8554/front_door"
      GO2RTC_API: "http://go2rtc:1984"
      GO2RTC_TALK_STREAM: "front_door_talk"
      FRIGATE_API: "http://frigate:5000"
      NTFY_URL: "http://ntfy"
      NTFY_TOPIC: "doorbell"
      NTFY_TOKEN: "${NTFY_GATEKEEPER_TOKEN:?run scripts/ntfy-auth.sh}"
      # Check the porch for packages left or taken after each visit.
      PACKAGE_ZONE: "porch"
      # Where the phone posts quick replies (the ntfy server as it reaches it).
      NTFY_PUBLIC_URL: "http://${SERVER_IP:?set SERVER_IP in .env}:8090"
      # Doorbell button presses (Reolink login over HTTPS, push events on 9000).
      REOLINK_HOST: "${CAMERA_IP:?set CAMERA_IP in .env}"
      REOLINK_USERNAME: "${CAMERA_USER:?set CAMERA_USER in .env}"
      REOLINK_PASSWORD: "${CAMERA_PASS:?set CAMERA_PASS in .env}"
      DWELL_SECONDS: "1"
      # Only greet people who enter Frigate's porch zone (frigate/config/config.yml).
      TRIGGER_ZONES: "porch"
      # Don't greet the household coming out: people who appear in Frigate's door
      # zone and walk out of it.
      DOOR_ZONE: "door"
      # Someone walking up this soon after someone left by the door is them coming back
      # (car, mailbox): not greeted. On the rig the household's quick returns took up to
      # 178 s over 8 days, and no outside visitor came that soon.
      RETURN_WINDOW_SECONDS: "240"
      # Recognize the household by face: off unless FACE_RECOGNITION=1 in .env (faces
      # are biometric data; enroll people with their consent, see the README).
      FACE_RECOGNITION: "${FACE_RECOGNITION:-0}"
      FACE_DIR: "/faces"
      # The web page (visits, household faces) on :8098, off unless GATEKEEPER_WEB_PASSWORD
      # is set.
      WEB_PASSWORD: "${GATEKEEPER_WEB_PASSWORD:-}"
      # The web page over HTTPS with its own (self-signed) certificate, for talking back
      # from the Live page: off unless WEB_TLS=1 in .env. It names the server's address.
      WEB_TLS: "${WEB_TLS:-0}"
      WEB_TLS_NAMES: "${SERVER_IP:?set SERVER_IP in .env}"
      # Gatekeeper's own person detection, next to Frigate's: off unless
      # OWN_PERCEPTION=shadow in .env. It only logs its tracks; the daily report compares
      # them with Frigate's. The rig's CPU takes ~265 ms a frame through the detector.
      OWN_PERCEPTION: "${OWN_PERCEPTION:-off}"
      # What starts the visits: Frigate's events, or with PERCEPTION=own in .env
      # Gatekeeper's own perception (Frigate then only stands in for zones not drawn on
      # the Zones page and for older visits' pictures).
      PERCEPTION: "${PERCEPTION:-frigate}"
      OWN_PERCEPTION_FPS: "3"
      # Gatekeeper's guess at each greeted visitor (a delivery or not), in shadow: off
      # unless DELIVERY_GUESS=1 in .env.
      DELIVERY_GUESS: "${DELIVERY_GUESS:-0}"
      # Hearing knocks at the door, in shadow: off unless KNOCK_LISTENER=shadow in .env.
      KNOCK_LISTENER: "${KNOCK_LISTENER:-off}"
      # Gatekeeper's own clips while someone's at the door (needs OWN_PERCEPTION): off
      # unless RECORDING=1 in .env. About 4 Mbit/s from the Reolink, kept 7 days.
      RECORDING: "${RECORDING:-0}"
      CLIP_DIR: "/clips"
      LISTEN_SECONDS: "4"
      WHISPER_MODEL: "base.en"
      WHISPER_COMPUTE_TYPE: "int8"
      KOKORO_VOICE: "af_heart"
      REPLY_PRESSED: "I've already told them you're here. If nobody answers the door, take the hint: they don't want to talk to you."
      AUDIO_DIR: "/audio"
      LOG_DIR: "/logs"
      LOG_FORMAT: "text"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR:-./data}/gatekeeper/audio:/audio
      - ${DATA_DIR:-./data}/gatekeeper/logs:/logs
      - ${DATA_DIR:-./data}/gatekeeper/cache:/root/.cache
      - ${DATA_DIR:-./data}/gatekeeper/faces:/faces
      - ${DATA_DIR:-./data}/gatekeeper/clips:/clips

networks:
  surveil:
    driver: bridge
