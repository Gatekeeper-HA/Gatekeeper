name: CLA

# Asks first-time contributors to agree to CLA.md by commenting on their pull request, and
# records each agreement on the cla-signatures branch (main is protected).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # CLA Assistant Lite v2.6.1. The project was archived in March 2026 (its releases
      # still work), so it's pinned to the release commit.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Gatekeeper-HA/Gatekeeper/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          allowlist: BaboOps,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
