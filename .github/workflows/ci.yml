name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests cloud
      - name: Test
        run: pytest --cov --cov-report=term-missing

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i -E -e 's/^SERVER_IP=$/SERVER_IP=127.0.0.1/' -e 's/^([A-Z_]+)=$/\1=ci/' .env
          docker compose config --quiet
          # The NVIDIA GPU override (docker-compose.gpu.yml) on top.
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Validate and build cloud/ (the name service's server)
        working-directory: cloud
        run: |
          cp .env.example .env
          sed -i -E -e 's/^ZONE=$/ZONE=hubs.example/' -e 's/^SERVER_IPV4=$/SERVER_IPV4=192.0.2.1/' \
            -e 's/^SERVER_IPV6=$/SERVER_IPV6=2001:db8::1/' -e 's/^PDNS_API_KEY=$/PDNS_API_KEY=ci/' .env
          docker compose config --quiet
          docker build --quiet .
